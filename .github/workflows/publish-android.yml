name: Publish Android to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        type: choice
        options:
          - alpha
          - production
        default: alpha

permissions:
  contents: read

concurrency:
  group: google-play-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check required secrets and install signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "Missing ANDROID_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || { echo "Missing ANDROID_RELEASE_KEY_PASSWORD"; exit 1; }
          test -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON" || { echo "Missing PLAY_STORE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$OPS_API_KEY" || { echo "Missing OPS_API_KEY"; exit 1; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release bundle
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Publish bundle to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.shekinah.tabernacle
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

  notify-alpha:
    needs: publish
    if: ${{ inputs.track == 'alpha' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Notify users after alpha publication
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: python scripts/bump_version_for_aab.py --sync-api-only --track alpha

  notify-production:
    needs: publish
    if: ${{ inputs.track == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production-review
      url: https://play.google.com/console/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Notify users after production approval
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: python scripts/bump_version_for_aab.py --sync-api-only --track production