name: Upload iOS to App Store Connect

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_number:
        description: Numéro de build iOS (auto = +build pubspec + 1 si vide)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-connect-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    environment:
      name: ios-app-store
      url: https://appstoreconnect.apple.com/
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Flutter
        run: |
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout f6ff1529fd6d8af5f706051d9251ac9231c83407
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Select Xcode 26 or later
        run: |
          set -euo pipefail
          xcode_app=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
          [[ -n "$xcode_app" ]] || { echo 'Xcode 26 introuvable sur ce runner.' >&2; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version

      - name: Resolve build number
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "IOS_BUILD_NUMBER=${{ inputs.build_number }}" >> "$GITHUB_ENV"
          else
            CURRENT=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
            [[ "$CURRENT" =~ ^[0-9]+$ ]] || { echo 'Version pubspec illisible.' >&2; exit 1; }
            echo "IOS_BUILD_NUMBER=$((CURRENT + 1))" >> "$GITHUB_ENV"
            echo "Build number auto : $((CURRENT + 1))"
          fi

      - name: Validate inputs and install Apple credentials
        env:
          BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo 'Le numéro de build doit être un entier.' >&2; exit 1; }
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Secret manquant : $name" >&2; exit 1; }
          done
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || exit 1
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"

      - name: Prepare Flutter and archive
        env:
          BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          flutter build ios --release --config-only --build-number "$BUILD_NUMBER"
          (cd ios && pod install --deployment)
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Preserve IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shekinah-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/ios-export/*.ipa)
          [[ ${#files[@]} -eq 1 ]] || { echo 'Une seule archive IPA est attendue.' >&2; exit 1; }
          xcrun altool --upload-app --type ios --file "${files[0]}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
